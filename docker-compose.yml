version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rodalivre-postgres
    environment:
      POSTGRES_USER: rodalivre
      POSTGRES_PASSWORD: rodalivre_password
      POSTGRES_DB: rodalivre_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rodalivre-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
