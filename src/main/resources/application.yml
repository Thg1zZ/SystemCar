spring:
  application:
    name: rodalivre-backend

  datasource:
    url: jdbc:h2:mem:rodalivre_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    show-sql: true

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:4b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c}
  expiration: 900000 # 15 minutos em ms
  refresh-expiration: 604800000 # 7 dias em ms

server:
  port: 8080
  error:
    include-message: always

# Chaves sensíveis — configure via variável de ambiente.
# DB_ENCRYPTION_KEY: chave AES-256 para criptografia de CPF/CNH (LGPD).
#   Mínimo obrigatório: 32 caracteres.
#   Configure no ambiente: $env:DB_ENCRYPTION_KEY = "sua-chave-aqui"
#   Nunca deixe esse valor no código-fonte ou neste arquivo se ele for versionado.
